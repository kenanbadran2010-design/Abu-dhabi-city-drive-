
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" build/AbuDhabiCityDrive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuDhabiCityDrive-Android
          path: build/AbuDhabiCityDrive.apk
