name: Build Abu Dhabi Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies and build 3D game
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android
      - name: Allow OSM requests
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" /><application|' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AbuDhabiDrive-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
