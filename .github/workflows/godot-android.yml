name: Build Godot City Drive APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Android templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure export and build
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd city_rebuild
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../AbuDhabiCityDrive-Godot.apk"
          [preset.0.options]
          package/unique_name="com.abudhabi.citydrive"
          package/name="Abu Dhabi City Drive"
          gradle_build/use_gradle_build=false
          EOF
          ../Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit
          ../Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug Android ../AbuDhabiCityDrive-Godot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AbuDhabiCityDrive-Godot-APK
          path: AbuDhabiCityDrive-Godot.apk
